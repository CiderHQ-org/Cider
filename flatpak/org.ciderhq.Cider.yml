app-id: org.ciderhq.Cider
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: ciderhq
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*/pkgconfig
  - /lib/cmake
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/doc
  - /share/man
  - /lib/*.a
finish-args:
  - --share=network
  - --share=ipc
  # Default X11/Xwayland and experimental native Wayland; the launcher is GTK.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # Roblox asks the GPU driver for VRAM through sysfs (host_vram_bytes).
  - --filesystem=/sys/class/drm:ro
modules:
  # Freedesktop supplies the graphics/audio stack. Bundle the launcher UI
  # libraries instead of inheriting GNOME 50's 25.08 graphics extensions.
  - launcher-ui.json
  - name: darling
    buildsystem: simple
    build-commands:
      - sh install-darling.sh debs.zip
    sources:
      - type: file
        url: https://github.com/darlinghq/darling/releases/download/v0.1.20260608/debs_20260608.zip
        sha256: 27469ef3932da2e91dd7fb34b70e3628a3e54b7af9fb5480051f44af35eca1fd
        dest-filename: debs.zip
      - type: file
        path: install-darling.sh

  - name: ciderhq
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
    build-commands:
      # The shim and the stub frameworks, against Darling's macOS root.
      - MACOBLOX_BUILD_DIR=/app/lib/ciderhq/shim DARLING_SYSROOT=/app/libexec/darling ./build_debug_shim.sh
      - rm -f /app/lib/ciderhq/shim/fast_libc.o
      # Darling without root (see flatpak/darling-noroot.c).
      - gcc -shared -fPIC -O2 -o /app/lib/ciderhq/darling-noroot.so flatpak/darling-noroot.c -ldl
      - clang -target x86_64-apple-darwin -fuse-ld=lld -isysroot /app/libexec/darling -mmacosx-version-min=11.0
        -dynamiclib -O2 -o /app/lib/ciderhq/launchd_pid1.dylib flatpak/launchd_pid1.c
      - install -d /app/share/ciderhq
      - cp -r launcher branding /app/share/ciderhq/
      - rm -rf /app/share/ciderhq/branding/source
      - install -m644 patch_startup_throttle.py /app/share/ciderhq/
      - install -m644 README.md /app/share/ciderhq/
      - install -Dm644 LICENSE /app/share/licenses/ciderhq/LICENSE
      - install -m644 LICENSES/MIT-MacOBlox.txt /app/share/licenses/ciderhq/
      - install -m644 launcher/macoblox/assets/fonts/*-OFL.txt /app/share/licenses/ciderhq/
      - rm -f /app/share/ciderhq/launcher/install.sh
      - python3 -m compileall -q -d /app/share/ciderhq/launcher /app/share/ciderhq/launcher
      - install -Dm755 flatpak/ciderhq.sh /app/bin/ciderhq
      - for size in 16 22 24 32 48 64 128 256 512 1024; do
          install -Dm644 "branding/icons/ciderhq-$size.png" "/app/share/icons/hicolor/${size}x${size}/apps/org.ciderhq.Cider.png";
          install -Dm644 "branding/icons/ciderhq-$size.png" "/app/share/icons/hicolor/${size}x${size}/apps/ciderhq.png";
          done
      - install -d /app/share/applications
      - sed 's/^Icon=.*/Icon=org.ciderhq.Cider/' packaging/org.ciderhq.Cider.desktop
        > /app/share/applications/org.ciderhq.Cider.desktop
      - sed 's/^Icon=.*/Icon=org.ciderhq.Cider/' packaging/org.ciderhq.Cider.URI.desktop
        > /app/share/applications/org.ciderhq.Cider.URI.desktop
      # The Roblox window's own entry, so docks show its icon.
      - sed 's/^Icon=.*/Icon=org.ciderhq.Cider/' packaging/ciderhq-roblox-window.desktop
        > /app/share/applications/org.ciderhq.Cider.RobloxWindow.desktop
      - install -Dm644 flatpak/org.ciderhq.Cider.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .github
          - website
          - vercel.json
          - .vercel
          - .vercelignore
          - RobloxPlayer.app
          - build
          - backups
          - downloads
          - logs
          - work
          - studio
          - ffmpeg6
          - ffmpeg_compat
          - frameworks_backup
          - .flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
