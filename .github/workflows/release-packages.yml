name: Quadra release packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch or commit to release
        type: string
        default: main
      publish:
        description: Publish after all distro packages build successfully
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: quadra-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: source
        name: Prepare the immutable source archive
        run: |
          version=$(python3 -c 'import json; print(json.load(open("packaging/release.json"))["version"])')
          [[ $version =~ ^[0-9]+\.[0-9]+([A-Za-z0-9.]*)$ ]]
          if [[ $GITHUB_REF == refs/tags/* ]]; then [[ $GITHUB_REF == refs/tags/v$version ]]; fi
          mkdir dist
          git archive --format=tar --prefix="Quadra-$version/" HEAD | gzip -n > "dist/quadrahq-$version-source.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: quadra-source
          path: dist/
          if-no-files-found: error

  regressions:
    name: Launcher regressions
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - name: Test with isolated settings and fake services
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          config=$(mktemp -d)
          XDG_CONFIG_HOME="$config/config" XDG_CACHE_HOME="$config/cache" \
            XDG_DATA_HOME="$config/data" DPREFIX="$config/prefix" bash tests/run.sh

  metal-host:
    name: Metal host and GPU readback
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - name: Build and verify the portable host library
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils libvulkan1 mesa-vulkan-drivers libllvm18
          rustup toolchain install 1.98.1 --profile minimal
          export RUSTUP_TOOLCHAIN=1.98.1
          export MACOBLOX_BUILD_DIR="$RUNNER_TEMP/metal-build"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/metal-target"
          bash prototype/metal-vulkan/build.sh host
          cargo test --locked --release --manifest-path prototype/metal-vulkan/host/Cargo.toml --lib -- --include-ignored
          clang -O2 -Wall -Wextra tests/metal_host_test.c -ldl -o "$RUNNER_TEMP/metal-host-test"
          "$RUNNER_TEMP/metal-host-test" "$MACOBLOX_BUILD_DIR/metal/libquadra_metal_host.so"
          mkdir metal-host
          cp "$MACOBLOX_BUILD_DIR/metal/libquadra_metal_host.so" metal-host/
      - uses: actions/upload-artifact@v4
        with:
          name: metal-host-internal
          path: metal-host/
          if-no-files-found: error

  build:
    name: Package (${{ matrix.flavor }})
    needs: [source, metal-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: arch
            image: archlinux:base-devel
          - flavor: ubuntu24.04
            image: ubuntu:24.04
          - flavor: fedora
            image: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          name: quadra-source
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: metal-host-internal
          path: metal-host
      - name: Stage a verified build sysroot
        run: python3 packaging/fetch-build-runtime.py --output "$RUNNER_TEMP/runtime"
      - name: Build in the target distro
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v "$GITHUB_WORKSPACE/out:/out" \
            -v "$GITHUB_WORKSPACE/metal-host:/metal-host:ro" \
            -e QUADRA_METAL_HOST_LIBRARY=/metal-host/libquadra_metal_host.so \
            -v "$RUNNER_TEMP/runtime/sysroot:/runtime:ro" "$IMAGE" \
            bash /src/packaging/ci/build-package.sh "$FLAVOR"
      - uses: actions/upload-artifact@v4
        with:
          name: quadra-${{ matrix.flavor }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [source, regressions, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: quadra-*
          path: dist
          merge-multiple: true
      - name: Publish the tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
        run: python3 packaging/ci/publish-packages.py dist "$VERSION" "$REVISION"
